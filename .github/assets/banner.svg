<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
      .ln{opacity:0;animation:show 8s steps(1) infinite}
      @keyframes show{0%{opacity:0}5%,95%{opacity:1}100%{opacity:0}}</style>
  </defs>
  <rect width="1200" height="320" fill="#0000aa"/>
  <!-- DOS style frame -->
  <rect x="20" y="20" width="1160" height="280" fill="none" stroke="#aaaaaa" stroke-width="3"/>
  <rect x="26" y="26" width="1148" height="268" fill="none" stroke="#aaaaaa" stroke-width="2"/>
  <rect x="470" y="12" width="260" height="20" fill="#0000aa"/>
  <text x="600" y="28" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ffff55">[ main.c ]</text>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="64" y="118" font-size="70" font-weight="700" fill="#ffffff">Basic_Codes</text>
    <text x="66" y="160" font-size="19" fill="#55ffff">#include &lt;stdio.h&gt;  // 20+ beginner C problems</text>
    <text x="66" y="196" font-size="17" fill="#aaaaaa">loops · patterns · primes · factorial · quadrants · x^y</text>
    <text x="66" y="262" font-size="17" fill="#ffff55">C:\&gt; gcc main.c &amp;&amp; a.exe<tspan class="cur" fill="#fff">_</tspan></text>
  </g>
  <!-- output pane -->
  <g transform="translate(790 56)" font-family="Consolas, 'Courier New', monospace" font-size="16">
    <rect width="350" height="214" fill="#000" stroke="#aaaaaa"/>
    <g fill="#aaaaaa">
      <text class="ln" x="14" y="26" style="animation-delay:-5.0s">1 Hello World</text>
      <text class="ln" x="14" y="48" style="animation-delay:-4.7s">2 Hello World</text>
      <text class="ln" x="14" y="70" style="animation-delay:-4.4s">3 Hello World</text>
      <text class="ln" x="14" y="92" style="animation-delay:-4.1s">4 Hello World</text>
      <text class="ln" x="14" y="114" style="animation-delay:-3.8s">5 Hello World</text>
      <text class="ln" x="14" y="136" style="animation-delay:-3.5s">6 Hello World</text>
      <text class="ln" x="14" y="158" style="animation-delay:-3.2s" fill="#ff5555">  (skip 7)</text>
      <text class="ln" x="14" y="180" style="animation-delay:-2.9s">8 Hello World</text>
      <text class="ln" x="14" y="202" style="animation-delay:-2.6s">9 Hello World</text>
    </g>
    <g fill="#55ff55" font-size="22" font-weight="700"><text x="200" y="60">*</text><text x="190" y="84">* *</text><text x="180" y="108">* * *</text><text x="170" y="132">* * * *</text></g>
  </g>
</svg>
